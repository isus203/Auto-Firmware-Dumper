# WARNING: This workflow is intended only for MediaTek (MTK) firmware/devices.
# It is not supported or validated for Qualcomm, Exynos, Unisoc, etc.
name: Auto Firmware Dumper - MTK Only (Git + Full Releases)

on:
  workflow_dispatch:
    inputs:
      USER_NAME:
        description: 'Git author name'
        required: true
        default: 'isus203'
        type: string
      FIRMWARE_URL:
        description: 'MTK/MediaTek firmware ONLY - URL supported by DumprX'
        required: true
        type: string
      VENDOR_NAME:
        description: 'Manufacturer fallback when build.prop is missing'
        required: false
        default: ''
        type: string
      CODE_NAME:
        description: 'Actual MTK device codename override (e.g. LJ9); optional'
        required: false
        default: ''
        type: string
      GENERATE_VENDOR:
        description: 'Generate and publish vendor tree to GitHub'
        type: boolean
        default: false
      UPLOAD_LINEAGE_DT:
        description: 'Generate and publish LineageOS device tree to GitHub'
        type: boolean
        default: false
      UPLOAD_TWRP_DT:
        description: 'Generate and publish experimental TWRP tree to GitHub'
        type: boolean
        default: false
      SEPOLICY_MODE:
        description: 'SELinux mode: versioned API, current macros, or disabled'
        type: choice
        options:
          - 'prebuilt'
          - 'current'
          - 'disabled'
        default: 'prebuilt'
      SEPOLICY_BRANCH:
        description: 'LineageOS android_system_sepolicy branch'
        type: string
        default: 'lineage-23.2'

concurrency:
  group: dumper-github-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dump:
    name: MediaTek (MTK) dump, decompile and publish
    # Same repository-owner protection as the existing workflows.
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      FIRMWARE_URL: ${{ inputs.FIRMWARE_URL }}
      USER_NAME: ${{ inputs.USER_NAME }}
      # Use the GitHub Actions bot no-reply address for every new commit.
      GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
      GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
      PUBLISH_PROVIDER: github
      PUSH_PAUSE_SECONDS: ${{ vars.DUMP_PUSH_PAUSE_SECONDS || '10' }}
      GIT_TREE_BUDGET_MIB: ${{ vars.GIT_TREE_BUDGET_MIB || '384' }}
      GIT_TREE_FILE_MAX_MIB: ${{ vars.GIT_TREE_FILE_MAX_MIB || '5' }}
      VENDOR_FALLBACK: ${{ inputs.VENDOR_NAME }}
      CODE_FALLBACK: ${{ inputs.CODE_NAME }}
      SEPOLICY_MODE: ${{ inputs.SEPOLICY_MODE }}
      SEPOLICY_BRANCH: ${{ inputs.SEPOLICY_BRANCH }}
      GENERATE_VENDOR: ${{ inputs.GENERATE_VENDOR }}
      UPLOAD_LINEAGE_DT: ${{ inputs.UPLOAD_LINEAGE_DT }}
      UPLOAD_TWRP_DT: ${{ inputs.UPLOAD_TWRP_DT }}
      # Override these URLs/refs in Settings > Secrets and variables > Actions > Variables.
      DUMPRX_REPO: ${{ vars.DUMPRX_REPO || 'https://github.com/xz529/DumprX.git' }}
      DUMPRX_REF: ${{ vars.DUMPRX_REF || '' }}
      AOSPDTGEN_REPO: ${{ vars.AOSPDTGEN_REPO || 'https://github.com/isus203/aospdtgen_mtk' }}
      AOSPDTGEN_REF: ${{ vars.AOSPDTGEN_REF || '' }}
      SEPOLICY_DECOMPILER_REPO: ${{ vars.SEPOLICY_DECOMPILER_REPO || 'https://github.com/isus203/SELinux-CIL-Decompiler.git' }}
      SEPOLICY_DECOMPILER_REF: ${{ vars.SEPOLICY_DECOMPILER_REF || '' }}
      TWRPDTGEN_REPO: ${{ vars.TWRPDTGEN_REPO || 'https://github.com/twrpdtgen/twrpdtgen.git' }}
      TWRPDTGEN_REF: ${{ vars.TWRPDTGEN_REF || '' }}
      EXTRACT_TOOLS_REF: ${{ vars.EXTRACT_TOOLS_REF || 'lineage-22.1' }}
    steps:
      - name: WARNING - MediaTek (MTK) devices only
        run: |
          echo '::warning title=MTK firmware only::This workflow is intended for MediaTek (MTK) devices only. Do not use it for Qualcomm, Exynos, Unisoc or other SoCs.'
          {
            echo '## ⚠️ MediaTek (MTK) devices only'
            echo 'This workflow is configured for MediaTek (MTK) firmware. Other chipsets are not supported or validated by this workflow.'
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            aria2 build-essential bison cpio curl detox erofs-utils f2fs-tools \
            flex git git-lfs gzip jq liblz4-tool lz4 m4 p7zip-full \
            python3-venv rsync tar unzip wget xz-utils zstd
          git lfs install --skip-repo
          pip install gdown
          command -v gh >/dev/null || { echo 'GitHub CLI (gh) is missing'; exit 1; }

      - name: Free unused SDK disk space
        run: |
          set -euo pipefail
          # Firmware extraction needs disk space; this workflow does not build
          # Android apps, .NET programs, or PowerShell projects.
          for unused in /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/lib/android/sdk; do
            if [[ -d "$unused" ]]; then sudo rm -rf "$unused"; fi
          done
          docker system prune --all --force >/dev/null 2>&1 || true
          df -h "$GITHUB_WORKSPACE"

      - name: Clone and set up DumprX
        run: |
          set -euo pipefail
          args=(--depth 1)
          if [[ -n "$DUMPRX_REF" ]]; then args+=(--branch "$DUMPRX_REF"); fi
          git clone "${args[@]}" "$DUMPRX_REPO" DumprX
          cd DumprX
          test -f dumper.sh && test -f setup.sh
          printf 'DumprX commit: %s\n' "$(git rev-parse HEAD)"
          bash setup.sh

      - name: Clone SELinux decompiler from repository
        if: env.SEPOLICY_MODE != 'disabled'
        run: |
          set -euo pipefail
          dest="$GITHUB_WORKSPACE/work/selinux-decompiler"
          mkdir -p "$GITHUB_WORKSPACE/work"
          args=(--depth 1)
          if [[ -n "$SEPOLICY_DECOMPILER_REF" ]]; then args+=(--branch "$SEPOLICY_DECOMPILER_REF"); fi
          git clone "${args[@]}" "$SEPOLICY_DECOMPILER_REPO" "$dest"
          if [[ ! -f "$dest/decompile.sh" ]]; then
            echo '::error::The selected SELinux repository/ref has no decompile.sh.'
            echo '::error::Publish the decompile.sh and its supporting sources from sepolicy.zip to that remote repo/branch, or set SEPOLICY_DECOMPILER_REPO and SEPOLICY_DECOMPILER_REF to a published updated repository. Set SEPOLICY_MODE=disabled to skip.'
            exit 1
          fi
          test -f "$dest/decompile_cil.py" || { echo '::error::Missing decompile_cil.py'; exit 1; }
          bash -n "$dest/decompile.sh"
          printf 'SELinux decompiler commit: %s\n' "$(git -C "$dest" rev-parse HEAD)"

      - name: Download and unpack firmware with DumprX
        run: |
          set -euo pipefail
          cd DumprX
          # DumprX accepts direct links, Google Drive, AndroidFileHost, etc.
          # Do not force every downloaded firmware to be named firmware.zip.
          gdown "$FIRMWARE_URL" -O firmware.zip
          bash dumper.sh ./firmware.zip
          test -d out || { echo 'DumprX/out was not created'; exit 1; }
          if ! find out -type f -name 'build.prop' -print -quit | grep -q .; then
            echo 'No build.prop was found: firmware extraction may have failed'
            exit 1
          fi
          sudo chown -R "$(id -u):$(id -g)" out

      - name: Read device metadata
        run: |
          set -euo pipefail
          dump="$GITHUB_WORKSPACE/DumprX/out"
          read_prop() {
            local key="$1" file
            for file in \
              "$dump/system/system/build.prop" "$dump/system/build.prop" \
              "$dump/vendor/build.prop" "$dump/vendor/etc/build.prop" \
              "$dump/product/build.prop" "$dump/system_ext/build.prop"; do
              if [[ -f "$file" ]]; then
                local value
                value="$(awk -v key="$key" 'index($0,key"=")==1 {sub(/^[^=]*=/,""); print; exit}' "$file")"
                if [[ -n "$value" ]]; then printf '%s' "$value"; return 0; fi
              fi
            done
            return 0
          }
          brand="$(read_prop ro.product.manufacturer)"
          [[ -n "$brand" ]] || brand="$(read_prop ro.product.brand)"
          [[ -n "$brand" ]] || brand="$VENDOR_FALLBACK"
          # Generic MTK system images often identify as mssi_*; prefer the
          # actual device from the vendor partition or explicit CODE_NAME.
          codename="$CODE_FALLBACK"
          [[ -n "$codename" ]] || codename="$(read_prop ro.product.vendor.device)"
          [[ -n "$codename" ]] || codename="$(read_prop ro.product.odm.device)"
          [[ -n "$codename" ]] || codename="$(read_prop ro.product.device)"
          [[ -n "$codename" ]] || codename="$(read_prop ro.build.product)"
          version="$(read_prop ro.build.version.release)"
          [[ -n "$version" ]] || version="unknown"
          branch="$(read_prop ro.vendor.build.id)"
          [[ -n "$branch" ]] || branch="$(read_prop ro.build.id)"
          [[ -n "$branch" ]] || branch="main"

          brand="$(printf '%s' "$brand" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/_/g; s/^_+|_+$//g' | cut -c1-48)"
          codename="$(printf '%s' "$codename" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/_/g; s/^_+|_+$//g' | cut -c1-48)"
          branch="$(printf '%s' "$branch" | sed -E 's/[^[:alnum:]_.-]+/_/g; s/\.\./_/g; s/^[^[:alnum:]]+//; s/[.]+$//; s/\.lock$//' | cut -c1-80)"
          [[ -n "$branch" ]] || branch=main
          [[ -n "$brand" && -n "$codename" ]] || {
            echo 'Cannot determine manufacturer/codename: provide VENDOR_NAME and CODE_NAME'
            exit 1
          }
          {
            echo "BRAND=$brand"
            echo "CODENAME=$codename"
            echo "ANDROID_VERSION=$version"
            echo "DUMP_BRANCH=$branch"
          } >> "$GITHUB_ENV"
          printf 'Manufacturer: %s\nCodename: %s\nAndroid: %s\nDump branch: %s\n' \
            "$brand" "$codename" "$version" "$branch"

      - name: Cache SEPolicy compilers and platform sources
        if: env.SEPOLICY_MODE != 'disabled'
        uses: actions/cache@v4
        with:
          path: |
            work/selinux-decompiler/.cache
            work/selinux-decompiler/out/host/linux-x86/bin
            work/selinux-decompiler/system/sepolicy
          key: sepolicy-${{ runner.os }}-${{ runner.arch }}-${{ inputs.SEPOLICY_BRANCH }}-v2

      - name: Decompile SELinux policy
        if: env.SEPOLICY_MODE != 'disabled'
        run: |
          set -euo pipefail
          decompiler="$GITHUB_WORKSPACE/work/selinux-decompiler"
          args=(
            -d "$GITHUB_WORKSPACE/DumprX/out"
            -o "$GITHUB_WORKSPACE/DumprX/out/selinux/decompiled"
            -b "$SEPOLICY_BRANCH"
          )
          if [[ "$SEPOLICY_MODE" == 'current' ]]; then args+=(--current); fi
          # decompile.sh reads the entire dump and resolves the proper policy
          # versions for system, system_ext, product, and vendor. ODM is warned
          # about, not falsely claimed as fully decompiled.
          bash "$decompiler/decompile.sh" "${args[@]}"
          test -n "$(find "$GITHUB_WORKSPACE/DumprX/out/selinux/decompiled" -type f -print -quit)"
          printf '\n## SELinux decompilation\n\n' >> "$GITHUB_WORKSPACE/DumprX/out/README.md"
          printf 'Generated using DumprX SEPolicy `decompile.sh`, branch `%s`.\n' \
            "$SEPOLICY_BRANCH" >> "$GITHUB_WORKSPACE/DumprX/out/README.md"
          printf 'Readable policies: `selinux/decompiled/` (system, system_ext, product, vendor when present).\n' \
            >> "$GITHUB_WORKSPACE/DumprX/out/README.md"

      - name: Upload decompiled SEPolicy as a standalone artifact
        if: env.SEPOLICY_MODE != 'disabled'
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-sepolicy-${{ github.run_id }}
          path: DumprX/out/selinux/decompiled/
          if-no-files-found: error
          retention-days: 14

      - name: Clean broken symlinks and add dump metadata
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/DumprX/out"
          # Only dangling symlinks are removed. Existing firmware files remain.
          find . -type l ! -exec test -e {} \; -print -delete
          if [[ ! -f README.md ]]; then printf '# Firmware dump\n' > README.md; fi
          {
            printf '\n> **WARNING:** This dump workflow targets **MediaTek (MTK)** devices only. Other chipsets are not supported or validated.\n'
            printf '\n## Dump metadata\n'
            printf -- '- Manufacturer: `%s`\n' "$BRAND"
            printf -- '- Device: `%s`\n' "$CODENAME"
            printf -- '- Android release: `%s`\n' "$ANDROID_VERSION"
            printf -- '- DumprX source: `%s`\n' "$DUMPRX_REPO"
          printf -- '- SELinux source: `%s`\n' "$SEPOLICY_DECOMPILER_REPO"
            if [[ "$SEPOLICY_MODE" != 'disabled' ]]; then
              printf -- '- SELinux: processed with `decompile.sh`\n'
            else
              printf -- '- SELinux: decompilation disabled for this run\n'
            fi
          } >> README.md

      - name: Generate LineageOS tree (when requested)
        if: env.GENERATE_VENDOR == 'true' || env.UPLOAD_LINEAGE_DT == 'true'
        run: |
          set -euo pipefail
          # Clone the Python package source, never install an unrelated PyPI build.
          src="$GITHUB_WORKSPACE/work/aospdtgen"
          mkdir -p "$GITHUB_WORKSPACE/work"
          args=(--depth 1)
          if [[ -n "$AOSPDTGEN_REF" ]]; then args+=(--branch "$AOSPDTGEN_REF"); fi
          git clone "${args[@]}" "$AOSPDTGEN_REPO" "$src"
          test -f "$src/pyproject.toml" || { echo 'Missing aospdtgen pyproject.toml'; exit 1; }
          python -m pip install "$src"
          python -m aospdtgen --help >/dev/null
          printf 'aospdtgen commit: %s\n' "$(git -C "$src" rev-parse HEAD)"
          mkdir -p "$GITHUB_WORKSPACE/generated/lineage" \
                   "$GITHUB_WORKSPACE/generated/android/device"
          python -m aospdtgen -o "$GITHUB_WORKSPACE/generated/lineage" "$GITHUB_WORKSPACE/DumprX/out"
          # New aospdtgen generates extract-files.py; older releases use .sh.
          # Some device trees have no proprietary-files list; BoardConfig.mk
          # is a more reliable marker of a successfully generated tree.
          test -f "$GITHUB_WORKSPACE/generated/lineage/BoardConfig.mk" || {
            echo 'aospdtgen produced no BoardConfig.mk'; exit 1;
          }
          # aospdtgen may use a generic system device name for the output
          # directory (mssi_64_64only_cn_armv82), while its generated extractor
          # explicitly targets the actual device (e.g. device/tecno/LJ9).
          # ExtractUtilsModule(device, vendor) is authoritative here.
          python - <<'PY_TREE'
          import ast
          import os
          import re
          import shutil
          from pathlib import Path

          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          src = workspace / 'generated/lineage'
          android = workspace / 'generated/android'
          extractor = src / 'extract-files.py'
          vendor_requested = os.environ.get('GENERATE_VENDOR') == 'true'

          brand = os.environ['BRAND']
          device = os.environ['CODENAME']
          if extractor.is_file():
              source = extractor.read_text(encoding='utf-8')
              tree = ast.parse(source, filename=str(extractor))
              constants = {}
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign) and isinstance(node.value, ast.Constant):
                      for target in node.targets:
                          if isinstance(target, ast.Name):
                              constants[target.id] = node.value.value

              def string_value(node):
                  if isinstance(node, ast.Constant) and isinstance(node.value, str):
                      return node.value
                  if isinstance(node, ast.Name):
                      value = constants.get(node.id)
                      return value if isinstance(value, str) else None
                  return None

              modules = []
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  name = node.func.id if isinstance(node.func, ast.Name) else getattr(node.func, 'attr', None)
                  if name != 'ExtractUtilsModule':
                      continue
                  args = [string_value(arg) for arg in node.args]
                  kwargs = {k.arg: string_value(k.value) for k in node.keywords if k.arg}
                  mod_device = args[0] if len(args) > 0 else kwargs.get('device') or kwargs.get('device_name')
                  mod_vendor = args[1] if len(args) > 1 else kwargs.get('vendor')
                  if mod_device and mod_vendor:
                      modules.append((mod_vendor, mod_device))
              modules = list(dict.fromkeys(modules))
              if len(modules) != 1:
                  if vendor_requested:
                      raise SystemExit(
                          f'::error::Cannot resolve a unique ExtractUtilsModule(device,vendor) in {extractor}: {modules}. '
                          'Set CODE_NAME and use an aospdtgen version with a valid extract-files.py.'
                      )
                  print(f'::warning::Cannot resolve ExtractUtilsModule; using metadata {brand}/{device}')
              else:
                  brand, device = modules[0]
          elif vendor_requested:
              raise SystemExit('::error::aospdtgen generated no extract-files.py, cannot extract vendor blobs')

          valid = re.compile(r'[A-Za-z0-9][A-Za-z0-9_.-]{0,63}\Z')
          for name, value in [('vendor', brand), ('device', device)]:
              if not valid.fullmatch(value) or value in ('.', '..'):
                  raise SystemExit(f'::error::Unsafe generated {name} identifier: {value!r}')

          target = android / 'device' / brand / device
          target.mkdir(parents=True, exist_ok=True)
          shutil.copytree(src, target, dirs_exist_ok=True, symlinks=True)
          if vendor_requested and not (target / 'proprietary-files.txt').is_file():
              available = sorted(p.name for p in target.glob('*proprietary*'))
              raise SystemExit(
                  f'::error::Missing {target}/proprietary-files.txt; extractor expects this file. '
                  f'Generated candidates: {available}. Check aospdtgen output before vendor extraction.'
              )
          if (brand, device) != (os.environ['BRAND'], os.environ['CODENAME']):
              print(f'::warning::System build.prop reported {os.environ["BRAND"]}/{os.environ["CODENAME"]}, '
                    f'but aospdtgen extractor targets {brand}/{device}; using extractor identity')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write(f'TREE_BRAND={brand}\nTREE_CODENAME={device}\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write(f'- Generated device tree: `device/{brand}/{device}`\n')
          print('Device tree:', target)
          print('Proprietary-files present:', (target / 'proprietary-files.txt').exists())
          PY_TREE

      - name: Extract vendor tree (when requested)
        if: env.GENERATE_VENDOR == 'true'
        run: |
          set -euo pipefail
          android="$GITHUB_WORKSPACE/generated/android"
          mkdir -p "$android/tools" "$android/prebuilts"
          git clone --depth 1 --branch "$EXTRACT_TOOLS_REF" \
            https://github.com/LineageOS/android_tools_extract-utils.git \
            "$android/tools/extract-utils"
          git clone --depth 1 --branch "$EXTRACT_TOOLS_REF" \
            https://github.com/LineageOS/android_prebuilts_extract-tools.git \
            "$android/prebuilts/extract-tools"
          # Use the identity declared in ExtractUtilsModule, not generic
          # ro.product.device (e.g. mssi_64_64only_cn_armv82).
          tree_brand="${TREE_BRAND:-$BRAND}"
          tree_codename="${TREE_CODENAME:-$CODENAME}"
          tree_dir="$android/device/$tree_brand/$tree_codename"
          [[ -d "$tree_dir" ]] || { echo "::error::Device tree missing: $tree_dir"; exit 1; }
          [[ -f "$tree_dir/proprietary-files.txt" ]] || {
            echo "::error::Device tree missing proprietary-files.txt: $tree_dir"; exit 1;
          }
          cd "$tree_dir"
          if [[ -f extract-files.py ]]; then
            PYTHONPATH="$android/tools/extract-utils${PYTHONPATH:+:$PYTHONPATH}" \
              python extract-files.py "$GITHUB_WORKSPACE/DumprX/out"
          elif [[ -f extract-files.sh ]]; then
            bash extract-files.sh "$GITHUB_WORKSPACE/DumprX/out"
          else
            echo '::error::The selected aospdtgen version produced no extract-files.py/sh'
            exit 1
          fi
          [[ -d "$android/vendor/$tree_brand/$tree_codename" ]] || {
            echo "::error::Vendor extraction produced no vendor tree at vendor/$tree_brand/$tree_codename"; exit 1;
          }

      - name: Generate TWRP tree (when requested)
        if: env.UPLOAD_TWRP_DT == 'true'
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/work/twrpdtgen"
          mkdir -p "$GITHUB_WORKSPACE/work"
          args=(--depth 1)
          if [[ -n "$TWRPDTGEN_REF" ]]; then args+=(--branch "$TWRPDTGEN_REF"); fi
          git clone "${args[@]}" "$TWRPDTGEN_REPO" "$src"
          test -f "$src/pyproject.toml" || { echo 'Missing twrpdtgen pyproject.toml'; exit 1; }
          python -m pip install "$src"
          python -m twrpdtgen --help >/dev/null
          printf 'twrpdtgen commit: %s\n' "$(git -C "$src" rev-parse HEAD)"
          dump="$GITHUB_WORKSPACE/DumprX"
          image="$(find "$dump/out" "$dump/input" -type f -name recovery.img -print -quit 2>/dev/null || true)"
          if [[ -z "$image" ]]; then
            image="$(find "$dump/out" "$dump/input" -type f -name boot.img -print -quit 2>/dev/null || true)"
          fi
          [[ -n "$image" ]] || { echo 'TWRP generator requires recovery.img or boot.img'; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/generated/twrp"
          ( cd "$GITHUB_WORKSPACE/generated/twrp" && python -m twrpdtgen "$image" )
          [[ -d "$GITHUB_WORKSPACE/generated/twrp/output" ]] || {
            echo 'TWRP generator did not produce an output directory'; exit 1;
          }

      - name: Publish optional trees to GitHub
        if: env.GENERATE_VENDOR == 'true' || env.UPLOAD_LINEAGE_DT == 'true' || env.UPLOAD_TWRP_DT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GTOKEN }}
          TARGET_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo 'GTOKEN secret is required to create tree repositories'; exit 1; }
          gh auth setup-git
          git_user="${USER_NAME:-github-actions[bot]}"
          tree_brand="${TREE_BRAND:-$BRAND}"
          tree_codename="${TREE_CODENAME:-$CODENAME}"
          publish_tree() {
            local source="$1" repo="$2" branch="$3"
            [[ -d "$source" ]] || { echo "Missing generated tree: $source"; return 1; }
            if ! gh repo view "$TARGET_OWNER/$repo" >/dev/null 2>&1; then
              gh repo create "$TARGET_OWNER/$repo" --public --description="Generated firmware tree for $CODENAME"
            fi
            (
              cd "$source"
              rm -rf .git
              git init -b "$branch"
              git config user.name "$git_user"
              git config user.email "$GIT_AUTHOR_EMAIL"
              git add -A
              git diff --cached --quiet && { echo "No files in $repo"; exit 1; }
              git commit -m "Auto-generated tree for $CODENAME"
              git remote add origin "https://github.com/$TARGET_OWNER/$repo.git"
              git push -u origin "$branch"
            )
            echo "- [$repo](https://github.com/$TARGET_OWNER/$repo/tree/$branch)" >> "$GITHUB_STEP_SUMMARY"
          }
          if [[ "$GENERATE_VENDOR" == 'true' ]]; then
            publish_tree "$GITHUB_WORKSPACE/generated/android/vendor/$tree_brand/$tree_codename" \
              "android_vendor_${tree_brand}_${tree_codename}" "vendor-${tree_codename}-${GITHUB_RUN_ID}"
          fi
          if [[ "$UPLOAD_LINEAGE_DT" == 'true' ]]; then
            publish_tree "$GITHUB_WORKSPACE/generated/android/device/$tree_brand/$tree_codename" \
              "lineage_device_${tree_brand}_${tree_codename}" "lineage-${tree_codename}-${GITHUB_RUN_ID}"
          fi
          if [[ "$UPLOAD_TWRP_DT" == 'true' ]]; then
            mapfile -d '' trees < <(find "$GITHUB_WORKSPACE/generated/twrp/output" \
              -type f -name BoardConfig.mk -print0)
            [[ "${#trees[@]}" -eq 1 ]] || {
              echo 'Cannot uniquely locate generated TWRP tree'; exit 1;
            }
            publish_tree "$(dirname "${trees[0]}")" \
              "twrp_device_${tree_brand}_${tree_codename}" "twrp-${tree_codename}-${GITHUB_RUN_ID}"
          fi
      - name: Create or resolve firmware dump repository
        env:
          GH_TOKEN: ${{ secrets.GTOKEN }}
          TARGET_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo '::error::GTOKEN secret is required'; exit 1; }
          target="$TARGET_OWNER/android_dump_${BRAND}_${CODENAME}"
          if ! gh repo view "$target" >/dev/null 2>&1; then
            gh repo create "$target" --public \
              --description="MediaTek (MTK) firmware dump: Git index and complete release archives."
          fi
          gh auth setup-git
          tag="dump-${CODENAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "PUBLISH_REMOTE=https://github.com/$target.git"
            echo "PUBLISH_WEB_URL=https://github.com/$target"
            echo "PUBLISH_BRANCH_URL=https://github.com/$target/tree/$DUMP_BRANCH"
            echo "PUBLISH_RELEASE_TAG=$tag"
            echo "PUBLISH_RELEASE_URL=https://github.com/$target/releases/tag/$tag"
            echo "PUBLISH_TARGET=$target"
          } >> "$GITHUB_ENV"

      - name: Prepare compact Git tree and complete dump index
        run: |
          set -euo pipefail
          python - <<'PY_PREPARE'
          import json
          import os
          import shutil
          from pathlib import Path

          work = Path(os.environ['GITHUB_WORKSPACE'])
          dump = work / 'DumprX/out'
          repo = work / 'work/github-dump-tree'
          repo.mkdir(parents=True, exist_ok=True)
          max_total = int(os.environ['GIT_TREE_BUDGET_MIB']) * 1024**2
          max_file = int(os.environ['GIT_TREE_FILE_MAX_MIB']) * 1024**2
          if not (32 * 1024**2 <= max_total <= 1024**3):
              raise SystemExit('GIT_TREE_BUDGET_MIB must be between 32 and 1024')
          if not (1024**2 <= max_file <= 20 * 1024**2):
              raise SystemExit('GIT_TREE_FILE_MAX_MIB must be between 1 and 20 MiB')

          candidates = []
          total_size = 0
          text_exts = {'.prop', '.xml', '.rc', '.te', '.cil', '.conf', '.json',
                       '.txt', '.md', '.mk', '.sh', '.py', '.dts', '.dtsi',
                       '.init', '.fstab', '.contexts', '.cfg', '.ini', '.bp',
                       '.list', '.policy', '.csv', '.service', '.rules'}
          special_names = {'file_contexts', 'property_contexts', 'service_contexts',
                           'seapp_contexts', 'hwservice_contexts', 'genfs_contexts',
                           'ueventd.rc', 'fstab', 'build.prop'}
          for directory, dirs, names in os.walk(dump, followlinks=False):
              dirs[:] = sorted(d for d in dirs if d not in {'.git', 'tmp'})
              for name in names:
                  path = Path(directory) / name
                  if path.is_symlink() or not path.is_file():
                      continue
                  rel = path.relative_to(dump)
                  try:
                      size = path.stat().st_size
                  except OSError:
                      continue
                  total_size += size
                  if name == 'README.md' and rel.parent == Path('.'):
                      continue
                  is_metadata = name in special_names or path.suffix.lower() in text_exts
                  # The Git view contains useful browseable text files only.
                  if not is_metadata or size > max_file:
                      continue
                  if str(rel).startswith('selinux/decompiled/'):
                      priority = 0
                  elif name in special_names or name.endswith('.prop'):
                      priority = 1
                  else:
                      priority = 2
                  candidates.append((priority, str(rel), size, path))

          selected = {}
          chosen_bytes = 0
          for priority, rel, size, path in sorted(candidates):
              if chosen_bytes + size > max_total:
                  continue
              selected[rel] = size
              chosen_bytes += size
              target = repo / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              try:
                  os.link(path, target)
              except OSError:
                  shutil.copy2(path, target)

          all_files = []
          for directory, dirs, names in os.walk(dump, followlinks=False):
              dirs[:] = sorted(d for d in dirs if d not in {'.git', 'tmp'})
              for name in sorted(names):
                  path = Path(directory) / name
                  rel = path.relative_to(dump)
                  if path.is_symlink():
                      all_files.append((str(rel), -1, 'archive'))
                  elif path.is_file():
                      all_files.append((str(rel), path.stat().st_size,
                                        'git+archive' if str(rel) in selected else 'archive'))
          with (repo / 'DUMP_INDEX.tsv').open('w', encoding='utf-8') as out:
              out.write('path\tsize_bytes\tlocation\n')
              for rel, size, loc in sorted(all_files):
                  clean = rel.replace('\\', '\\\\').replace('\t', '\\t').replace('\n', '\\n')
                  out.write(f'{clean}\t{size}\t{loc}\n')

          # Preserve the DumprX README and link the complete dump archive.
          original = (dump / 'README.md').read_text(errors='replace') if (dump / 'README.md').exists() else ''
          release = os.environ['PUBLISH_RELEASE_URL']
          note = (
              '\n## Complete firmware download\n\n'
              f'**Full firmware dump:** {release}\n\n'
              'The Git branch is a compact text-file browsing view, not the full dump. '
              'All original files are included in the split 7z release archive. '
              'Download every `.7z.NNN` file and extract from `.7z.001` using 7-Zip. '
              'See `DUMP_INDEX.tsv` for the per-file index.\n'
              '\n**WARNING: MediaTek (MTK) devices only.**\n'
          )
          (repo / 'README.md').write_text(original + note, encoding='utf-8')
          with (repo / 'SELECTED_PATHS.txt').open('w', encoding='utf-8') as out:
              out.write('\n'.join(sorted(selected)) + '\n')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a', encoding='utf-8') as out:
              out.write('## Hybrid 14 GB-friendly publishing\n')
              out.write(f'- Extracted regular files: {total_size / 1024**3:.2f} GiB\n')
              out.write(f'- Git browsing view: {len(selected)} files / {chosen_bytes / 1024**2:.2f} MiB\n')
              out.write(f'- Complete files are archived in: {release}\n')
          print(f'Complete dump: {total_size / 1024**3:.2f} GiB')
          print(f'Git browsing view: {len(selected)} files; {chosen_bytes / 1024**2:.2f} MiB')
          PY_PREPARE

      - name: Push browsable Git index in small commits
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/work/github-dump-tree"
          # Never initialize Git in DumprX/out; full files stay available for 7z.
          rm -rf .git
          git init -b "$DUMP_BRANCH"
          git config user.name "${USER_NAME:-github-actions[bot]}"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git config pack.threads 2
          git remote add origin "$PUBLISH_REMOTE"
          git add -- README.md DUMP_INDEX.tsv SELECTED_PATHS.txt
          git commit -m "Initialize firmware dump for $CODENAME"

          # Replace only the managed dump branch; do not overwrite other branches.
          remote_line="$(git ls-remote --heads origin "refs/heads/$DUMP_BRANCH")"
          remote_oid="${remote_line%%$'\\t'*}"
          if [[ -n "$remote_line" ]]; then
            git push --force-with-lease="refs/heads/$DUMP_BRANCH:$remote_oid" \
              -u origin "HEAD:refs/heads/$DUMP_BRANCH"
          else
            git push -u origin "HEAD:refs/heads/$DUMP_BRANCH"
          fi

          # Up to 128 MiB per commit, preserving the directory-oriented history.
          batch_limit=$((128 * 1024 * 1024))
          batch_bytes=0
          batch_count=0
          batch_no=0
          group_label=''
          flush_batch() {
            if (( batch_count == 0 )); then return 0; fi
            if ! git diff --cached --quiet; then
              batch_no=$((batch_no + 1))
              git commit -m "Import $group_label batch $batch_no for $CODENAME"
              git push origin "HEAD:refs/heads/$DUMP_BRANCH"
              sleep "${PUSH_PAUSE_SECONDS:-10}"
            fi
            batch_bytes=0
            batch_count=0
          }
          while IFS= read -r -d '' file; do
            rel="${file#./}"
            case "$rel" in README.md|DUMP_INDEX.tsv|SELECTED_PATHS.txt) continue ;; esac
            if [[ "$rel" == */* ]]; then top="${rel%%/*}"; else top='root'; fi
            if [[ "$top" != "$group_label" ]]; then
              flush_batch
              group_label="$top"
              batch_no=0
            fi
            bytes="$(stat -c %s -- "$file")"
            if (( batch_count > 0 && (batch_bytes + bytes > batch_limit || batch_count >= 200) )); then
              flush_batch
            fi
            git add -f -- "$file"
            batch_count=$((batch_count + 1))
            batch_bytes=$((batch_bytes + bytes))
          done < <(find . -path './.git' -prune -o -type f -print0 | sort -z)
          flush_batch
          {
            echo "### GitHub browsable tree"
            echo "- $PUBLISH_BRANCH_URL"
            echo "- Git view deliberately excludes large firmware binaries"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create split 7z archive of the FULL firmware dump
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/DumprX/input" "$GITHUB_WORKSPACE/DumprX/out/tmp"
          mkdir -p "$GITHUB_WORKSPACE/releases"
          archive="$GITHUB_WORKSPACE/releases/full_dump_${CODENAME}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.7z"
          dump="$GITHUB_WORKSPACE/DumprX/out"
          # Keep the complete dump (including binaries) in these archives.
          # Volumes are under GitHub's 2 GiB per-release-asset limit.
          # A separate copy of the whole dump is NOT staged for Git.
          df -h "$GITHUB_WORKSPACE"
          (
            cd "$dump"
            7z a -t7z -mx=1 -v1800m "$archive" .
          )
          shopt -s nullglob
          chunks=( "$archive".* )
          (( ${#chunks[@]} > 0 )) || { echo '::error::No 7z volumes produced'; exit 1; }
          ( cd "$GITHUB_WORKSPACE/releases" && sha256sum full_dump_*.7z.* > SHA256SUMS.txt )
          (
            cd "$GITHUB_WORKSPACE/releases"
            7z t "$(basename "$archive").001" >/dev/null
          )
          {
            echo "### Full firmware archive"
            echo "- Archive volumes: ${#chunks[@]}"
            echo "- Release: $PUBLISH_RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish full dump in GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GTOKEN }}
        run: |
          set -euo pipefail
          tag="$PUBLISH_RELEASE_TAG"
          target="$PUBLISH_TARGET"
          gh release create "$tag" --draft --repo "$target" --target "$DUMP_BRANCH" \
            --title "Full MTK firmware dump $BRAND $CODENAME ($ANDROID_VERSION)" \
            --notes "Complete firmware dump in numbered 7z volumes. Download every .7z.NNN file, verify SHA256SUMS.txt, then extract .7z.001 with 7-Zip. WARNING: MediaTek (MTK) devices only."
          shopt -s nullglob
          volumes=( "$GITHUB_WORKSPACE"/releases/full_dump_*.7z.* )
          (( ${#volumes[@]} > 0 )) || { echo '::error::No release volumes to upload'; exit 1; }
          for part in "${volumes[@]}" "$GITHUB_WORKSPACE/releases/SHA256SUMS.txt"; do
            ok=0
            for attempt in 1 2 3; do
              if gh release upload "$tag" "$part" --repo "$target" --clobber; then
                ok=1
                break
              fi
              echo "::warning::Release upload failed for $(basename "$part"), retry $attempt/3"
              sleep $(( attempt * 20 ))
            done
            (( ok == 1 )) || { echo "::error::Release asset upload failed: $part"; exit 1; }
          done
          # Publish only after every volume and checksum asset is uploaded.
          gh release edit "$tag" --repo "$target" --draft=false
          echo "- Full download: $PUBLISH_RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload small firmware images (if available)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-images-${{ github.run_id }}
          path: |
            DumprX/out/boot/*.img
            DumprX/out/recovery/*.img
            DumprX/out/vendor_boot/*.img
            DumprX/out/init_boot/*.img
            DumprX/out/dtbo/*.img
          if-no-files-found: ignore
          retention-days: 7
