# WARNING: This workflow is intended only for MediaTek (MTK) firmware/devices.
# It is not supported or validated for Qualcomm, Exynos, Unisoc, etc.
name: Auto Firmware Dumper - MTK Only (GitLab Git + LFS)

on:
  workflow_dispatch:
    inputs:
      USER_NAME:
        description: 'Git author name'
        required: true
        default: 'isus203'
        type: string
      FIRMWARE_URL:
        description: 'MediaTek (MTK) ZIP on Google Drive; downloaded with gdown'
        required: true
        type: string
      VENDOR_NAME:
        description: 'Manufacturer fallback when build.prop is missing'
        required: false
        default: ''
        type: string
      CODE_NAME:
        description: 'Actual MTK device codename override (e.g. LJ9); optional'
        required: false
        default: ''
        type: string
      GENERATE_VENDOR:
        description: 'Generate and publish vendor tree to GitLab'
        type: boolean
        default: false
      UPLOAD_LINEAGE_DT:
        description: 'Generate and publish LineageOS device tree to GitLab'
        type: boolean
        default: false
      UPLOAD_TWRP_DT:
        description: 'Generate and publish experimental TWRP tree to GitLab'
        type: boolean
        default: false
      UPLOAD_FULL_DUMP:
        description: 'Publish full extracted dump to GitLab (turn OFF for >10 GiB Free project)'
        type: boolean
        default: true
      SEPOLICY_MODE:
        description: 'SELinux mode: versioned API, current macros, or disabled'
        type: choice
        options:
          - 'prebuilt'
          - 'current'
          - 'disabled'
        default: 'prebuilt'
      SEPOLICY_BRANCH:
        description: 'LineageOS android_system_sepolicy branch'
        type: string
        default: 'lineage-23.2'

concurrency:
  group: dumper-gitlab-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dump:
    name: MediaTek (MTK) dump, decompile and publish
    # Same repository-owner protection as the existing workflows.
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      FIRMWARE_URL: ${{ inputs.FIRMWARE_URL }}
      USER_NAME: ${{ inputs.USER_NAME }}
      # Never use the account's personal email. For GitLab attribution,
      # set GITLAB_COMMIT_EMAIL to the private commit email from GitLab profile.
      GIT_AUTHOR_EMAIL: ${{ vars.GITLAB_COMMIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
      GIT_COMMITTER_EMAIL: ${{ vars.GITLAB_COMMIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
      PUBLISH_PROVIDER: gitlab
      PUSH_PAUSE_SECONDS: ${{ vars.DUMP_PUSH_PAUSE_SECONDS || '10' }}
      VENDOR_FALLBACK: ${{ inputs.VENDOR_NAME }}
      CODE_FALLBACK: ${{ inputs.CODE_NAME }}
      SEPOLICY_MODE: ${{ inputs.SEPOLICY_MODE }}
      SEPOLICY_BRANCH: ${{ inputs.SEPOLICY_BRANCH }}
      GENERATE_VENDOR: ${{ inputs.GENERATE_VENDOR }}
      UPLOAD_LINEAGE_DT: ${{ inputs.UPLOAD_LINEAGE_DT }}
      UPLOAD_TWRP_DT: ${{ inputs.UPLOAD_TWRP_DT }}
      UPLOAD_FULL_DUMP: ${{ inputs.UPLOAD_FULL_DUMP }}
      # Override these URLs/refs in Settings > Secrets and variables > Actions > Variables.
      DUMPRX_REPO: ${{ vars.DUMPRX_REPO || 'https://github.com/xz529/DumprX.git' }}
      DUMPRX_REF: ${{ vars.DUMPRX_REF || '' }}
      AOSPDTGEN_REPO: ${{ vars.AOSPDTGEN_REPO || 'https://github.com/isus203/aospdtgen_mtk.git' }}
      AOSPDTGEN_REF: ${{ vars.AOSPDTGEN_REF || '' }}
      SEPOLICY_DECOMPILER_REPO: ${{ vars.SEPOLICY_DECOMPILER_REPO || 'https://github.com/isus203/SELinux-CIL-Decompiler.git' }}
      SEPOLICY_DECOMPILER_REF: ${{ vars.SEPOLICY_DECOMPILER_REF || '' }}
      TWRPDTGEN_REPO: ${{ vars.TWRPDTGEN_REPO || 'https://github.com/twrpdtgen/twrpdtgen.git' }}
      TWRPDTGEN_REF: ${{ vars.TWRPDTGEN_REF || '' }}
      EXTRACT_TOOLS_REF: ${{ vars.EXTRACT_TOOLS_REF || 'lineage-22.1' }}
    steps:
      - name: WARNING - MediaTek (MTK) devices only
        run: |
          echo '::warning title=MTK firmware only::This workflow is intended for MediaTek (MTK) devices only. Do not use it for Qualcomm, Exynos, Unisoc or other SoCs.'
          {
            echo '## ⚠️ MediaTek (MTK) devices only'
            echo 'This workflow is configured for MediaTek (MTK) firmware. Other chipsets are not supported or validated by this workflow.'
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            aria2 build-essential bison cpio curl detox erofs-utils f2fs-tools \
            flex git git-lfs gzip jq liblz4-tool lz4 m4 p7zip-full \
            python3-venv rsync tar unzip wget xz-utils zstd
          git lfs install --skip-repo
          python -m pip install --upgrade gdown

      - name: Free unused SDK disk space
        run: |
          set -euo pipefail
          # Firmware extraction needs disk space; this workflow does not build
          # Android apps, .NET programs, or PowerShell projects.
          for unused in /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/lib/android/sdk; do
            if [[ -d "$unused" ]]; then sudo rm -rf "$unused"; fi
          done
          docker system prune --all --force >/dev/null 2>&1 || true
          df -h "$GITHUB_WORKSPACE"

      - name: Clone and set up DumprX
        run: |
          set -euo pipefail
          args=(--depth 1)
          if [[ -n "$DUMPRX_REF" ]]; then args+=(--branch "$DUMPRX_REF"); fi
          git clone "${args[@]}" "$DUMPRX_REPO" DumprX
          cd DumprX
          test -f dumper.sh && test -f setup.sh
          printf 'DumprX commit: %s\n' "$(git rev-parse HEAD)"
          bash setup.sh

      - name: Clone SELinux decompiler from repository
        if: env.SEPOLICY_MODE != 'disabled'
        run: |
          set -euo pipefail
          dest="$GITHUB_WORKSPACE/work/selinux-decompiler"
          mkdir -p "$GITHUB_WORKSPACE/work"
          args=(--depth 1)
          if [[ -n "$SEPOLICY_DECOMPILER_REF" ]]; then args+=(--branch "$SEPOLICY_DECOMPILER_REF"); fi
          git clone "${args[@]}" "$SEPOLICY_DECOMPILER_REPO" "$dest"
          if [[ ! -f "$dest/decompile.sh" ]]; then
            echo '::error::The selected SELinux repository/ref has no decompile.sh.'
            echo '::error::Publish the decompile.sh and its supporting sources from sepolicy.zip to that remote repo/branch, or set SEPOLICY_DECOMPILER_REPO and SEPOLICY_DECOMPILER_REF to a published updated repository. Set SEPOLICY_MODE=disabled to skip.'
            exit 1
          fi
          test -f "$dest/decompile_cil.py" || { echo '::error::Missing decompile_cil.py'; exit 1; }
          bash -n "$dest/decompile.sh"
          printf 'SELinux decompiler commit: %s\n' "$(git -C "$dest" rev-parse HEAD)"

      - name: Download firmware.zip with gdown and unpack using DumprX
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/DumprX"
          [[ -n "$FIRMWARE_URL" ]] || { echo '::error::FIRMWARE_URL is empty'; exit 1; }
          # Requested Google Drive download path (not DumprX URL downloader).
          gdown "$FIRMWARE_URL" -O firmware.zip
          [[ -s firmware.zip ]] || { echo '::error::gdown did not create firmware.zip'; exit 1; }
          echo "Downloaded firmware size: $(du -h firmware.zip | cut -f1)"
          bash dumper.sh ./firmware.zip
          [[ -d out ]] || { echo '::error::DumprX/out was not created'; exit 1; }
          if ! find out -type f -name build.prop -print -quit | grep -q .; then
            echo '::error::No build.prop found in extracted firmware'
            exit 1
          fi
          sudo chown -R "$(id -u):$(id -g)" out
          # A ~14 GB downloaded ZIP otherwise competes with the extracted dump
          # and the GitHub Release archive for the runner's limited disk space.
          rm -f -- firmware.zip
          df -h "$GITHUB_WORKSPACE"

      - name: Read device metadata
        run: |
          set -euo pipefail
          dump="$GITHUB_WORKSPACE/DumprX/out"
          read_prop() {
            local key="$1" file
            for file in \
              "$dump/system/system/build.prop" "$dump/system/build.prop" \
              "$dump/vendor/build.prop" "$dump/vendor/etc/build.prop" \
              "$dump/product/build.prop" "$dump/system_ext/build.prop"; do
              if [[ -f "$file" ]]; then
                local value
                value="$(awk -v key="$key" 'index($0,key"=")==1 {sub(/^[^=]*=/,""); print; exit}' "$file")"
                if [[ -n "$value" ]]; then printf '%s' "$value"; return 0; fi
              fi
            done
            return 0
          }
          brand="$(read_prop ro.product.manufacturer)"
          [[ -n "$brand" ]] || brand="$(read_prop ro.product.brand)"
          [[ -n "$brand" ]] || brand="$VENDOR_FALLBACK"
          # Generic MTK system images often identify as mssi_*; prefer the
          # actual device from the vendor partition or explicit CODE_NAME.
          codename="$CODE_FALLBACK"
          [[ -n "$codename" ]] || codename="$(read_prop ro.product.vendor.device)"
          [[ -n "$codename" ]] || codename="$(read_prop ro.product.odm.device)"
          [[ -n "$codename" ]] || codename="$(read_prop ro.product.device)"
          [[ -n "$codename" ]] || codename="$(read_prop ro.build.product)"
          version="$(read_prop ro.build.version.release)"
          [[ -n "$version" ]] || version="unknown"
          branch="$(read_prop ro.vendor.build.id)"
          [[ -n "$branch" ]] || branch="$(read_prop ro.build.id)"
          [[ -n "$branch" ]] || branch="main"

          brand="$(printf '%s' "$brand" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/_/g; s/^_+|_+$//g' | cut -c1-48)"
          codename="$(printf '%s' "$codename" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/_/g; s/^_+|_+$//g' | cut -c1-48)"
          branch="$(printf '%s' "$branch" | sed -E 's/[^[:alnum:]_.-]+/_/g; s/\.\./_/g; s/^[^[:alnum:]]+//; s/[.]+$//; s/\.lock$//' | cut -c1-80)"
          [[ -n "$branch" ]] || branch=main
          [[ -n "$brand" && -n "$codename" ]] || {
            echo 'Cannot determine manufacturer/codename: provide VENDOR_NAME and CODE_NAME'
            exit 1
          }
          {
            echo "BRAND=$brand"
            echo "CODENAME=$codename"
            echo "ANDROID_VERSION=$version"
            echo "DUMP_BRANCH=$branch"
          } >> "$GITHUB_ENV"
          printf 'Manufacturer: %s\nCodename: %s\nAndroid: %s\nGitLab branch: %s\n' \
            "$brand" "$codename" "$version" "$branch"

      - name: Cache SEPolicy compilers and platform sources
        if: env.SEPOLICY_MODE != 'disabled'
        uses: actions/cache@v4
        with:
          path: |
            work/selinux-decompiler/.cache
            work/selinux-decompiler/out/host/linux-x86/bin
            work/selinux-decompiler/system/sepolicy
          key: sepolicy-${{ runner.os }}-${{ runner.arch }}-${{ inputs.SEPOLICY_BRANCH }}-v2

      - name: Decompile SELinux policy
        if: env.SEPOLICY_MODE != 'disabled'
        run: |
          set -euo pipefail
          decompiler="$GITHUB_WORKSPACE/work/selinux-decompiler"
          args=(
            -d "$GITHUB_WORKSPACE/DumprX/out"
            -o "$GITHUB_WORKSPACE/DumprX/out/selinux/decompiled"
            -b "$SEPOLICY_BRANCH"
          )
          if [[ "$SEPOLICY_MODE" == 'current' ]]; then args+=(--current); fi
          # decompile.sh reads the entire dump and resolves the proper policy
          # versions for system, system_ext, product, and vendor. ODM is warned
          # about, not falsely claimed as fully decompiled.
          bash "$decompiler/decompile.sh" "${args[@]}"
          test -n "$(find "$GITHUB_WORKSPACE/DumprX/out/selinux/decompiled" -type f -print -quit)"
          printf '\n## SELinux decompilation\n\n' >> "$GITHUB_WORKSPACE/DumprX/out/README.md"
          printf 'Generated using DumprX SEPolicy `decompile.sh`, branch `%s`.\n' \
            "$SEPOLICY_BRANCH" >> "$GITHUB_WORKSPACE/DumprX/out/README.md"
          printf 'Readable policies: `selinux/decompiled/` (system, system_ext, product, vendor when present).\n' \
            >> "$GITHUB_WORKSPACE/DumprX/out/README.md"

      - name: Upload decompiled SEPolicy as a standalone artifact
        if: env.SEPOLICY_MODE != 'disabled'
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-sepolicy-${{ github.run_id }}
          path: DumprX/out/selinux/decompiled/
          if-no-files-found: error
          retention-days: 14

      - name: Clean broken symlinks and add dump metadata
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/DumprX/out"
          # Only dangling symlinks are removed. Existing firmware files remain.
          find . -type l ! -exec test -e {} \; -print -delete
          if [[ ! -f README.md ]]; then printf '# Firmware dump\n' > README.md; fi
          {
            printf '\n> **WARNING:** This dump workflow targets **MediaTek (MTK)** devices only. Other chipsets are not supported or validated.\n'
            printf '\n## Dump metadata\n'
            printf -- '- Manufacturer: `%s`\n' "$BRAND"
            printf -- '- Device: `%s`\n' "$CODENAME"
            printf -- '- Android release: `%s`\n' "$ANDROID_VERSION"
            printf -- '- DumprX source: `%s`\n' "$DUMPRX_REPO"
          printf -- '- SELinux source: `%s`\n' "$SEPOLICY_DECOMPILER_REPO"
            if [[ "$SEPOLICY_MODE" != 'disabled' ]]; then
              printf -- '- SELinux: processed with `decompile.sh`\n'
            else
              printf -- '- SELinux: decompilation disabled for this run\n'
            fi
          } >> README.md

      - name: Generate LineageOS tree (when requested)
        if: env.GENERATE_VENDOR == 'true' || env.UPLOAD_LINEAGE_DT == 'true'
        run: |
          set -euo pipefail
          # Clone the Python package source, never install an unrelated PyPI build.
          src="$GITHUB_WORKSPACE/work/aospdtgen"
          mkdir -p "$GITHUB_WORKSPACE/work"
          args=(--depth 1)
          if [[ -n "$AOSPDTGEN_REF" ]]; then args+=(--branch "$AOSPDTGEN_REF"); fi
          git clone "${args[@]}" "$AOSPDTGEN_REPO" "$src"
          test -f "$src/pyproject.toml" || { echo 'Missing aospdtgen pyproject.toml'; exit 1; }
          python -m pip install "$src"
          python -m aospdtgen --help >/dev/null
          printf 'aospdtgen commit: %s\n' "$(git -C "$src" rev-parse HEAD)"
          mkdir -p "$GITHUB_WORKSPACE/generated/lineage" \
                   "$GITHUB_WORKSPACE/generated/android/device"
          # This MTK fork supports explicit real device/vendor overrides.
          # Example: LJ9 instead of mssi_64_64only_cn_armv82.
          gen_args=(-o "$GITHUB_WORKSPACE/generated/lineage")
          [[ -n "$CODE_FALLBACK" ]] && gen_args+=(--codename "$CODE_FALLBACK")
          [[ -n "$VENDOR_FALLBACK" ]] && gen_args+=(--vendor "$VENDOR_FALLBACK")
          python -m aospdtgen "${gen_args[@]}" "$GITHUB_WORKSPACE/DumprX/out"
          # New aospdtgen generates extract-files.py; older releases use .sh.
          # Some device trees have no proprietary-files list; BoardConfig.mk
          # is a more reliable marker of a successfully generated tree.
          test -f "$GITHUB_WORKSPACE/generated/lineage/BoardConfig.mk" || {
            echo 'aospdtgen produced no BoardConfig.mk'; exit 1;
          }
          # aospdtgen may use a generic system device name for the output
          # directory (mssi_64_64only_cn_armv82), while its generated extractor
          # explicitly targets the actual device (e.g. device/tecno/LJ9).
          # ExtractUtilsModule(device, vendor) is authoritative here.
          python - <<'PY_TREE'
          import ast
          import os
          import re
          import shutil
          from pathlib import Path

          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          src = workspace / 'generated/lineage'
          android = workspace / 'generated/android'
          extractor = src / 'extract-files.py'
          vendor_requested = os.environ.get('GENERATE_VENDOR') == 'true'

          brand = os.environ['BRAND']
          device = os.environ['CODENAME']
          if extractor.is_file():
              source = extractor.read_text(encoding='utf-8')
              tree = ast.parse(source, filename=str(extractor))
              constants = {}
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign) and isinstance(node.value, ast.Constant):
                      for target in node.targets:
                          if isinstance(target, ast.Name):
                              constants[target.id] = node.value.value

              def string_value(node):
                  if isinstance(node, ast.Constant) and isinstance(node.value, str):
                      return node.value
                  if isinstance(node, ast.Name):
                      value = constants.get(node.id)
                      return value if isinstance(value, str) else None
                  return None

              modules = []
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  name = node.func.id if isinstance(node.func, ast.Name) else getattr(node.func, 'attr', None)
                  if name != 'ExtractUtilsModule':
                      continue
                  args = [string_value(arg) for arg in node.args]
                  kwargs = {k.arg: string_value(k.value) for k in node.keywords if k.arg}
                  mod_device = args[0] if len(args) > 0 else kwargs.get('device') or kwargs.get('device_name')
                  mod_vendor = args[1] if len(args) > 1 else kwargs.get('vendor')
                  if mod_device and mod_vendor:
                      modules.append((mod_vendor, mod_device))
              modules = list(dict.fromkeys(modules))
              if len(modules) != 1:
                  if vendor_requested:
                      raise SystemExit(
                          f'::error::Cannot resolve a unique ExtractUtilsModule(device,vendor) in {extractor}: {modules}. '
                          'Set CODE_NAME and use an aospdtgen version with a valid extract-files.py.'
                      )
                  print(f'::warning::Cannot resolve ExtractUtilsModule; using metadata {brand}/{device}')
              else:
                  brand, device = modules[0]
          elif vendor_requested:
              raise SystemExit('::error::aospdtgen generated no extract-files.py, cannot extract vendor blobs')

          valid = re.compile(r'[A-Za-z0-9][A-Za-z0-9_.-]{0,63}\Z')
          for name, value in [('vendor', brand), ('device', device)]:
              if not valid.fullmatch(value) or value in ('.', '..'):
                  raise SystemExit(f'::error::Unsafe generated {name} identifier: {value!r}')

          target = android / 'device' / brand / device
          target.mkdir(parents=True, exist_ok=True)
          shutil.copytree(src, target, dirs_exist_ok=True, symlinks=True)
          if vendor_requested and not (target / 'proprietary-files.txt').is_file():
              available = sorted(p.name for p in target.glob('*proprietary*'))
              raise SystemExit(
                  f'::error::Missing {target}/proprietary-files.txt; extractor expects this file. '
                  f'Generated candidates: {available}. Check aospdtgen output before vendor extraction.'
              )
          if (brand, device) != (os.environ['BRAND'], os.environ['CODENAME']):
              print(f'::warning::System build.prop reported {os.environ["BRAND"]}/{os.environ["CODENAME"]}, '
                    f'but aospdtgen extractor targets {brand}/{device}; using extractor identity')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as env:
              env.write(f'TREE_BRAND={brand}\nTREE_CODENAME={device}\n')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write(f'- Generated device tree: `device/{brand}/{device}`\n')
          print('Device tree:', target)
          print('Proprietary-files present:', (target / 'proprietary-files.txt').exists())
          PY_TREE

      - name: Extract vendor tree and generate build files (when requested)
        if: env.GENERATE_VENDOR == 'true'
        run: |
          set -euo pipefail
          android="$GITHUB_WORKSPACE/generated/android"
          dump="$GITHUB_WORKSPACE/DumprX/out"
          log="$GITHUB_WORKSPACE/vendor-extraction.log"
          mkdir -p "$android/tools" "$android/prebuilts"
          git clone --depth 1 --branch "$EXTRACT_TOOLS_REF" \
            https://github.com/LineageOS/android_tools_extract-utils.git \
            "$android/tools/extract-utils"
          git clone --depth 1 --branch "$EXTRACT_TOOLS_REF" \
            https://github.com/LineageOS/android_prebuilts_extract-tools.git \
            "$android/prebuilts/extract-tools"

          # Respect the exact device/vendor used by the generated extractor.
          tree_brand="${TREE_BRAND:-$BRAND}"
          tree_codename="${TREE_CODENAME:-$CODENAME}"
          tree_dir="$android/device/$tree_brand/$tree_codename"
          vendor_dir="$android/vendor/$tree_brand/$tree_codename"
          [[ -d "$tree_dir" ]] || { echo "::error::Device tree missing: $tree_dir"; exit 1; }
          [[ -s "$tree_dir/proprietary-files.txt" ]] || {
            echo "::error::Device tree has no populated proprietary-files.txt: $tree_dir"
            exit 1
          }

          cd "$tree_dir"
          echo "Vendor extraction: device=$tree_brand/$tree_codename" | tee "$log"
          echo "Proprietary entries: $(grep -cEv '^[[:space:]]*(#|$)' proprietary-files.txt || true)" | tee -a "$log"
          if [[ -f extract-files.py ]]; then
            # LineageOS Python extract-utils may return exit status 0 even if
            # process_modules() reports missing blobs and stops BEFORE writing
            # Android.bp, Android.mk and BoardConfigVendor.mk.
            PYTHONPATH="$android/tools/extract-utils${PYTHONPATH:+:$PYTHONPATH}" \
              python3 extract-files.py "$dump" 2>&1 | tee -a "$log"
            if grep -Fq 'Some files failed to process' "$log"; then
              echo '::error::Vendor extraction is incomplete. See vendor-extraction.log for missing blob paths.'
              exit 1
            fi

            # Generate the Make/Soong metadata explicitly (supported by
            # LineageOS extract-utils 22.1, in addition to its normal run()).
            PYTHONPATH="$android/tools/extract-utils${PYTHONPATH:+:$PYTHONPATH}" \
              python3 extract-files.py --regenerate_makefiles "$dump" 2>&1 | tee -a "$log"
          elif [[ -f extract-files.sh ]]; then
            bash extract-files.sh "$dump" 2>&1 | tee -a "$log"
            # The legacy generator uses a separate setup-makefiles.sh.
            if [[ -f setup-makefiles.sh ]]; then
              bash setup-makefiles.sh 2>&1 | tee -a "$log"
            fi
          else
            echo '::error::The generated tree has no extract-files.py or extract-files.sh'
            exit 1
          fi

          [[ -d "$vendor_dir/proprietary" ]] || {
            echo "::error::Vendor extraction produced no proprietary/ directory: $vendor_dir"
            exit 1
          }
          blob_count="$(find "$vendor_dir/proprietary" -type f | wc -l)"
          echo "Extracted regular files: $blob_count" | tee -a "$log"
          [[ "$blob_count" -gt 0 ]] || {
            echo '::error::Vendor extraction produced zero regular blob files'
            exit 1
          }

          # Do not publish a misleading partial tree containing only
          # proprietary/ and .gitattributes. The filename of the vendor product
          # mk can differ between devices (LJ9-vendor.mk, FULL-64-vendor.mk).
          missing=()
          [[ -f "$vendor_dir/BoardConfigVendor.mk" ]] || missing+=(BoardConfigVendor.mk)
          [[ -f "$vendor_dir/Android.bp" || -f "$vendor_dir/Android.mk" ]] || missing+=(Android.bp/Android.mk)
          if ! find "$vendor_dir" -maxdepth 1 -type f -name '*-vendor.mk' -print -quit | grep -q .; then
            missing+=('*-vendor.mk')
          fi
          echo 'Vendor repository root:' | tee -a "$log"
          find "$vendor_dir" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort | tee -a "$log"
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing vendor build files: ${missing[*]}. Check the extraction log, proprietary-files.txt and the aospdtgen extractor."
            exit 1
          fi
          echo 'Vendor tree is complete enough to publish: proprietary files and build metadata exist.'

      - name: Upload vendor extraction diagnostics
        if: always() && inputs.GENERATE_VENDOR
        uses: actions/upload-artifact@v4
        with:
          name: vendor-extraction-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: vendor-extraction.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate TWRP tree (when requested)
        if: env.UPLOAD_TWRP_DT == 'true'
        run: |
          set -euo pipefail
          src="$GITHUB_WORKSPACE/work/twrpdtgen"
          mkdir -p "$GITHUB_WORKSPACE/work"
          args=(--depth 1)
          if [[ -n "$TWRPDTGEN_REF" ]]; then args+=(--branch "$TWRPDTGEN_REF"); fi
          git clone "${args[@]}" "$TWRPDTGEN_REPO" "$src"
          test -f "$src/pyproject.toml" || { echo 'Missing twrpdtgen pyproject.toml'; exit 1; }
          python -m pip install "$src"
          python -m twrpdtgen --help >/dev/null
          printf 'twrpdtgen commit: %s\n' "$(git -C "$src" rev-parse HEAD)"
          dump="$GITHUB_WORKSPACE/DumprX"
          image="$(find "$dump/out" "$dump/input" -type f -name recovery.img -print -quit 2>/dev/null || true)"
          if [[ -z "$image" ]]; then
            image="$(find "$dump/out" "$dump/input" -type f -name boot.img -print -quit 2>/dev/null || true)"
          fi
          [[ -n "$image" ]] || { echo 'TWRP generator requires recovery.img or boot.img'; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/generated/twrp"
          ( cd "$GITHUB_WORKSPACE/generated/twrp" && python -m twrpdtgen "$image" )
          [[ -d "$GITHUB_WORKSPACE/generated/twrp/output" ]] || {
            echo 'TWRP generator did not produce an output directory'; exit 1;
          }

      - name: Finalize firmware-only dump before publishing
        run: |
          set -euo pipefail
          dump="$GITHUB_WORKSPACE/DumprX/out"
          [[ -d "$dump" ]] || { echo '::error::Missing extracted dump'; exit 1; }

          # DumprX or generators may put a device tree directly into out/.
          # Trees have their own GitLab repositories: they must not become
          # top-level directories of android_dump_<manufacturer>_<device>.
          # Only delete recognized generator OUTPUTS at the dump root; never
          # delete firmware partitions such as system, vendor, odm or dtbo.
          removed_trees=0
          for name in \
            aosp-device-tree aosp_device_tree \
            lineage-device-tree lineageos-device-tree \
            twrp-device-tree vendor-tree \
            device-tree device_tree; do
            candidate="$dump/$name"
            if [[ -e "$candidate" || -L "$candidate" ]]; then
              echo "Removing generated tree from dump: $name"
              rm -rf -- "$candidate"
              removed_trees=$((removed_trees + 1))
            fi
          done

          # Follow the original gitlab.yml.txt policy: keep decompiled policy,
          # but do not duplicate raw SELinux folders under selinux/.
          # Original partition directories outside selinux/ are preserved.
          for part in system vendor product system_ext odm; do
            candidate="$dump/selinux/$part"
            if [[ -d "$candidate" && ! -L "$candidate" ]]; then
              echo "Removing duplicate SELinux input: selinux/$part"
              rm -rf -- "$candidate"
            fi
          done

          # Exactly as in gitlab.yml.txt: remove dangling symlinks only.
          # Working firmware symlinks are not removed.
          echo 'Removing broken symbolic links from dump:'
          find "$dump" -type l ! -exec test -e {} \; -print -delete

          # Explicit safety check so an accidental future generator change
          # cannot silently publish the unwanted top-level device tree.
          if [[ -e "$dump/aosp-device-tree" || -L "$dump/aosp-device-tree" ]]; then
            echo '::error::aosp-device-tree must not be present in published dump'
            exit 1
          fi

          if [[ ! -f "$dump/README.md" ]]; then
            printf '# Firmware dump\n' > "$dump/README.md"
          fi
          {
            printf '\n## Publishing cleanup\n'
            printf '%s\n' '- Broken symbolic links removed; valid firmware symlinks preserved.'
            printf '%s\n' '- Generated device trees are excluded from the firmware dump (published separately when selected).'
            printf '%s\n' '- Duplicate SELinux input folders under `selinux/` are excluded; decompiled policy is retained.'
            printf '%s\n' '- SenseTime entries and `.lic` files are excluded from Git publication.'
          } >> "$dump/README.md"
          {
            echo '### Firmware-only dump cleanup'
            echo "- Removed generated tree entries: $removed_trees"
            echo '- Device trees are published only to their respective GitLab repositories.'
            echo '- Removed broken links and duplicate SELinux inputs from firmware-only content.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight Git and LFS sizes
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/DumprX/out/tmp"
          python - <<'PY_PREFLIGHT'
          import os
          from pathlib import Path

          root = Path(os.environ['GITHUB_WORKSPACE']) / 'DumprX' / 'out'
          lfs_threshold = 50 * 1024 * 1024
          github_max_file = 2_000_000_000  # Conservative GitHub Free 2 GB/file bound
          size_total = size_lfs = n_lfs = n_files = 0
          too_large = []
          for directory, subdirs, filenames in os.walk(root, followlinks=False):
              subdirs[:] = [name for name in subdirs if name not in ('.git', 'tmp')]
              for name in filenames:
                  file = Path(directory) / name
                  if file.is_symlink():
                      continue
                  try:
                      size = file.stat().st_size
                  except OSError:
                      continue
                  n_files += 1
                  size_total += size
                  if size >= lfs_threshold:
                      size_lfs += size
                      n_lfs += 1
                      if size > github_max_file:
                          too_large.append((str(file.relative_to(root)), size))
          def gib(n):
              return f'{n / (1024**3):.2f} GiB'
          print(f'Files: {n_files}; total: {gib(size_total)}')
          print(f'Files >= 50 MiB: {n_lfs}; estimated LFS: {gib(size_lfs)}')
          if os.environ.get('PUBLISH_PROVIDER') == 'gitlab' and size_total > 9.5 * 1024**3:
              print('::warning::Extracted dump is larger than the 10 GiB GitLab Free project quota. '
                    'Even correctly tracked Git LFS files consume project storage. '
                    'Set UPLOAD_FULL_DUMP=false to publish only the requested '
                    'Vendor/Lineage/TWRP trees, or use another archive host.')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as file:
              file.write('### Dump size before upload\n')
              file.write(f'- Extracted files: {n_files}; total: {gib(size_total)}\n')
              file.write(f'- LFS candidates: {n_lfs}; volume: {gib(size_lfs)}\n')
          if os.environ.get('PUBLISH_PROVIDER') == 'github':
              quota = float(os.environ.get('GITHUB_LFS_QUOTA_GIB', '10'))
              if quota <= 0:
                  raise SystemExit('GITHUB_LFS_QUOTA_GIB must be greater than 0')
              if too_large:
                  for filename, size in too_large[:12]:
                      print(f'::error::GitHub Free LFS 2 GB/file limit: {filename}: {size} bytes')
                  raise SystemExit('GitHub upload not attempted: a file exceeds 2 GB')
              if size_lfs > quota * (1024**3):
                  raise SystemExit(
                      f'GitHub upload not attempted: {gib(size_lfs)} estimated LFS exceeds '
                      f'{quota:g} GiB configured budget. Use Releases for large firmware assets '
                      'or change GITHUB_LFS_QUOTA_GIB when your account has more capacity.'
                  )
              print('::notice::This check cannot know LFS storage already used by your account, '
                    'and cannot guarantee GitHub will accept a large repository.')
          PY_PREFLIGHT

      - name: Create or resolve firmware dump repository
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$GITLAB_TOKEN" ]] || { echo '::error::GITLAB_TOKEN secret is required'; exit 1; }
          repo="android_dump_${BRAND}_${CODENAME}"
          api=https://gitlab.com/api/v4
          user_json="$(curl -fsS --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$api/user")"
          username="$(printf '%s' "$user_json" | python -c 'import sys,json; print(json.load(sys.stdin)["username"])')"
          encoded="$(printf '%s' "$username/$repo" | python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe=""))')"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$api/projects/$encoded")"
          if [[ "$status" == 404 ]]; then
            curl --fail-with-body -sS --request POST \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --data-urlencode "name=$repo" --data-urlencode "path=$repo" \
              --data-urlencode 'visibility=public' \
              --data-urlencode 'description=MediaTek (MTK) firmware dump. For MTK devices only.' \
              "$api/projects" >/dev/null
          elif [[ "$status" != 200 ]]; then
            echo "GitLab lookup failed (HTTP $status)"; exit 1
          fi
          {
            echo "GITLAB_USERNAME=$username"
            echo "PUBLISH_REMOTE=git@gitlab.com:$username/$repo.git"
            echo "PUBLISH_WEB_URL=https://gitlab.com/$username/$repo"
            echo "PUBLISH_BRANCH_URL=https://gitlab.com/$username/$repo/-/tree/$DUMP_BRANCH"
          } >> "$GITHUB_ENV"
          echo "Repository: https://gitlab.com/$username/$repo"

      - name: Configure SSH for GitLab
        env:
          GITLAB_SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$GITLAB_SSH_KEY" ]] || { echo '::error::GITLAB_SSH_KEY secret is required'; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$GITLAB_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H gitlab.com >> "$HOME/.ssh/known_hosts" 2>/dev/null

      - name: Publish optional device trees to GitLab
        if: env.GENERATE_VENDOR == 'true' || env.UPLOAD_LINEAGE_DT == 'true' || env.UPLOAD_TWRP_DT == 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_TREE_BUDGET_GIB: ${{ vars.GITLAB_TREE_BUDGET_GIB || '9.5' }}
        run: |
          set -euo pipefail
          [[ -n "${GITLAB_TOKEN:-}" ]] || { echo '::error::Missing GITLAB_TOKEN'; exit 1; }
          [[ -n "${GITLAB_USERNAME:-}" ]] || { echo '::error::No GitLab username; check repository preparation'; exit 1; }
          tree_brand="${TREE_BRAND:-$BRAND}"
          tree_codename="${TREE_CODENAME:-$CODENAME}"
          api='https://gitlab.com/api/v4'

          publish_tree() {
            local source="$1" repo="$2" branch="$3"
            [[ -d "$source" ]] || { echo "::error::Missing generated tree: $source"; return 1; }

            # Prepare and validate the complete local Git/LFS commit BEFORE
            # creating a remote project. An unsuccessful upload must not create
            # another empty GitLab project that displays setup instructions.
            (
              cd "$source"
              rm -rf .git
              git init -b "$branch"
              git config user.name "${USER_NAME:-github-actions[bot]}"
              git config user.email "$GIT_AUTHOR_EMAIL"
              git config core.quotepath false
              git config pack.threads 2
              git lfs install --local

              # GitLab Free rejects normal Git blobs >= 100 MiB.
              # Set up Git LFS before 'git add', including extensions that
              # wouldn't normally be considered binaries (png, wav, etc.).
              local large_count=0
              while IFS= read -r -d '' path; do
                git lfs track -- "$path"
                large_count=$((large_count + 1))
              done < <(find . -type f -size +49M \
                -not -path './.git/*' -printf '%P\0')

              git add -A
              if git diff --cached --quiet; then
                echo "::error::No generated files to publish in $source"
                exit 1
              fi

              # Verify the staged version of each large working-tree file,
              # not just that a .gitattributes file happened to be created.
              # GitLab's pre-receive hook checks Git objects, not file sizes
              # on disk. Fail before publishing if any object escaped LFS.
              python3 - <<'PY_LFS_CHECK'
          import os
          import subprocess
          from pathlib import Path

          entries = subprocess.check_output(
              ['git', 'ls-files', '--stage', '-z']).split(b'\0')
          large_paths = []
          total_bytes = 0
          problems = []
          for entry in entries:
              if not entry:
                  continue
              info, raw_path = entry.split(b'\t', 1)
              mode, sha, stage = info.decode('ascii').split()
              if mode not in ('100644', '100755'):
                  continue
              name = os.fsdecode(raw_path)
              path = Path(name)
              if not path.is_file() or path.is_symlink():
                  continue
              size = path.stat().st_size
              total_bytes += size
              if size >= 50 * 1024**2:
                  large_paths.append((name, sha, size))

          # A budget preflight prevents an obvious quota failure, even when
          # LFS pointers fix the 100 MiB individual blob restriction.
          budget_gib = float(os.environ['GITLAB_TREE_BUDGET_GIB'])
          if budget_gib <= 0:
              raise SystemExit('GITLAB_TREE_BUDGET_GIB must be greater than zero')
          print(f'Tree total files: {total_bytes / 1024**3:.2f} GiB, '
                f'large LFS candidates: {len(large_paths)}, '
                f'configured budget: {budget_gib:g} GiB')
          if total_bytes > budget_gib * 1024**3:
              raise SystemExit(
                  f'::error::Tree is {total_bytes / 1024**3:.2f} GiB; '
                  f'this exceeds the configured GitLab Git+LFS budget of '
                  f'{budget_gib:g} GiB. Free projects have a 10 GiB '
                  'repository+LFS storage cap. Split the tree or use paid storage.'
              )

          for name, sha, size in large_paths:
              attr = subprocess.check_output(
                  ['git', 'check-attr', '--cached', 'filter', '--', name],
                  text=True).strip()
              staged_size = int(subprocess.check_output(
                  ['git', 'cat-file', '-s', sha], text=True).strip())
              blob = subprocess.check_output(['git', 'cat-file', 'blob', sha])
              if (not attr.endswith(': lfs') or
                  staged_size >= 100 * 1024**2 or
                  not blob.startswith(b'version https://git-lfs.github.com/spec/v1\n')):
                  problems.append(f'{name}: working file={size} bytes, '
                                  f'staged blob={staged_size} bytes, attr={attr}')

          # Also catch any other normal Git object above the Free limit.
          oids = []
          for entry in entries:
              if not entry:
                  continue
              info, _ = entry.split(b'\t', 1)
              mode, sha, stage = info.decode('ascii').split()
              if mode in ('100644', '100755'):
                  oids.append(sha)
          if oids:
              sizes = subprocess.check_output(
                  ['git', 'cat-file', '--batch-check=%(objectsize)'],
                  input=('\n'.join(oids) + '\n').encode('ascii')).splitlines()
              oversized = [s for s in sizes if int(s) >= 100 * 1024**2]
              if oversized:
                  problems.append(f'{len(oversized)} staged Git blob(s) >= 100 MiB')

          if problems:
              for problem in problems[:25]:
                  print('::error::Git LFS preflight: ' + problem)
              raise SystemExit('Unsafe Git blobs found. No project was pushed.')
          print('Git LFS preflight passed: all large files are LFS pointers.')
          PY_LFS_CHECK

              git commit -m "Auto-generated MTK tree for $tree_codename"
              echo "Prepared $repo: $large_count large file(s) tracked by Git LFS."
            )

            # Only now resolve/create the GitLab repository.
            local encoded status
            encoded="$(printf '%s' "${GITLAB_USERNAME}/${repo}" |
              python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read(),safe=""))')"
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$api/projects/$encoded")"
            case "$status" in
              200) echo "GitLab tree repository exists: $repo" ;;
              404)
                curl --fail-with-body -sS --request POST \
                  --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
                  --data-urlencode "name=$repo" \
                  --data-urlencode "path=$repo" \
                  --data-urlencode 'visibility=public' \
                  --data-urlencode "description=MediaTek (MTK) device tree for $tree_codename" \
                  "$api/projects" >/dev/null ;;
              *) echo "::error::GitLab project lookup returned HTTP $status for $repo"; return 1 ;;
            esac

            (
              cd "$source"
              git remote add origin "git@gitlab.com:${GITLAB_USERNAME}/${repo}.git"
              # LFS uploads occur over the GitLab LFS transport using the
              # configured SSH identity. Upload objects before the Git ref.
              git lfs push origin "$branch"
              git push -u origin "HEAD:refs/heads/$branch"
            )
            echo "- [$repo](https://gitlab.com/$GITLAB_USERNAME/$repo/-/tree/$branch)" >> "$GITHUB_STEP_SUMMARY"
          }

          if [[ "$GENERATE_VENDOR" == 'true' ]]; then
            publish_tree "$GITHUB_WORKSPACE/generated/android/vendor/$tree_brand/$tree_codename" \
              "android_vendor_${tree_brand}_${tree_codename}" "vendor-${tree_codename}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          if [[ "$UPLOAD_LINEAGE_DT" == 'true' ]]; then
            publish_tree "$GITHUB_WORKSPACE/generated/android/device/$tree_brand/$tree_codename" \
              "lineage_device_${tree_brand}_${tree_codename}" "lineage-${tree_codename}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          if [[ "$UPLOAD_TWRP_DT" == 'true' ]]; then
            mapfile -d '' trees < <(find "$GITHUB_WORKSPACE/generated/twrp/output" \
              -type f -name BoardConfig.mk -print0)
            [[ "${#trees[@]}" -eq 1 ]] || {
              echo '::error::Cannot uniquely locate generated TWRP tree'; exit 1;
            }
            publish_tree "$(dirname "${trees[0]}")" \
              "twrp_device_${tree_brand}_${tree_codename}" "twrp-${tree_codename}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi

      - name: Upload firmware dump with Git and LFS
        if: env.UPLOAD_FULL_DUMP == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/DumprX/out"
          # Guard the publication boundary: never publish the generated tree,
          # including when DumprX changes its output layout later in the job.
          for name in aosp-device-tree aosp_device_tree lineage-device-tree \
                      lineageos-device-tree twrp-device-tree vendor-tree \
                      device-tree device_tree; do
            rm -rf -- "$name"
          done
          find . -type l ! -exec test -e {} \; -print -delete
          rm -rf .git
          git init -b "$DUMP_BRANCH"
          git config user.name "${USER_NAME:-github-actions[bot]}"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git config pack.threads 2
          git lfs install --local
          git remote add origin "$PUBLISH_REMOTE"

          # As in gitlab.yml.txt: exclude SenseTime paths and .lic files
          # from publication. Retain existing DumprX ignore rules if any.
          cat >> .gitignore <<'DUMP_GITIGNORE'
          # Firmware dump publishing exclusions (case-insensitive glob classes)
          *[sS][eE][nN][sS][eE][tT][iI][mM][eE]*
          *.[lL][iI][cC]
          DUMP_GITIGNORE

          # Always initialize LFS rules before staging firmware content.
          # Do not track paths that have to be excluded from Git entirely.
          while IFS= read -r -d '' file; do
            lower="${file,,}"
            if [[ "$lower" == *sensetime* || "$lower" == *.lic ]]; then
              continue
            fi
            git lfs track -- "$file"
          done < <(find . -type f -size +49M -not -path './.git/*' -printf '%P\0')
          touch .gitattributes
          git add -- README.md .gitattributes .gitignore
          git commit -m "Initialize firmware dump for $CODENAME"

          # Replace only the managed firmware branch, protecting concurrent edits.
          # No uncontrolled --force is used.
          remote_line="$(git ls-remote --heads origin "refs/heads/$DUMP_BRANCH")"
          remote_oid="${remote_line%%$'\t'*}"
          if [[ -n "$remote_line" ]]; then
            git push --force-with-lease="refs/heads/$DUMP_BRANCH:$remote_oid" \
              -u origin "HEAD:refs/heads/$DUMP_BRANCH"
          else
            git push -u origin "HEAD:refs/heads/$DUMP_BRANCH"
          fi

          # GitHub enforces a 2 GiB push limit. Commit and upload in manageable
          # batches within each top-level folder; also works the same on GitLab.
          batch_limit=$((384 * 1024 * 1024))
          batch_count=0
          batch_bytes=0
          batch_no=0
          group_label=''
          flush_batch() {
            if (( batch_count == 0 )); then return 0; fi
            if ! git diff --cached --quiet; then
              batch_no=$((batch_no + 1))
              git commit -m "Import $group_label batch $batch_no for $CODENAME"
              git push origin "HEAD:refs/heads/$DUMP_BRANCH"
              sleep "${PUSH_PAUSE_SECONDS:-10}"
            fi
            batch_count=0
            batch_bytes=0
          }
          while IFS= read -r -d '' file; do
            case "$file" in ./README.md|./.gitattributes|./.gitignore) continue ;; esac
            path="${file#./}"
            # git add -A -- <ignored-path> exits nonzero on an explicit
            # ignored file. Skip exclusions in the batched import as well.
            lower="${path,,}"
            if [[ "$lower" == *sensetime* || "$lower" == *.lic ]]; then
              continue
            fi
            if [[ "$path" == */* ]]; then top="${path%%/*}"; else top='root'; fi
            if [[ "$top" != "$group_label" ]]; then
              flush_batch
              group_label="$top"
              batch_no=0
            fi
            # stat follows no symbolic links: the staged symlink size is small.
            size="$(stat -c %s -- "$file")"
            if (( batch_count > 0 && (batch_bytes + size > batch_limit || batch_count >= 200) )); then
              flush_batch
            fi
            git add -A -- "$file"
            batch_count=$((batch_count + 1))
            batch_bytes=$((batch_bytes + size))
          done < <(find . -path './.git' -prune -o \
            \( -type f -o -type l \) -print0 | sort -z)
          flush_batch

          # Catch .gitignore, deletions, or any other unstaged residual changes.
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Complete firmware dump for $CODENAME"
            git push origin "HEAD:refs/heads/$DUMP_BRANCH"
          fi
          {
            echo "### Published firmware dump"
            echo "- Provider: $PUBLISH_PROVIDER"
            echo "- Repository: $PUBLISH_WEB_URL"
            echo "- Branch: $PUBLISH_BRANCH_URL"
            echo "- MediaTek (MTK) devices only"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload small firmware images (if available)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-images-${{ github.run_id }}
          path: |
            DumprX/out/boot/*.img
            DumprX/out/recovery/*.img
            DumprX/out/vendor_boot/*.img
            DumprX/out/init_boot/*.img
            DumprX/out/dtbo/*.img
          if-no-files-found: ignore
          retention-days: 7
